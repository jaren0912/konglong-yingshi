name: Build Konglong Yingshi APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Install MainActivity
        run: |
          SOURCE="./MainActivity.kt"
          TARGET="$PROJECT_DIR/app/src/main/java/com/konglong/yingshi/MainActivity.kt"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: MainActivity.kt missing from repository root"
            exit 1
          fi

          if [ ! -f "$TARGET" ]; then
            echo "ERROR: MainActivity destination not found: $TARGET"
            exit 1
          fi

          cp "$SOURCE" "$TARGET"

      - name: Configure Android TV manifest
        run: |
          python3 - "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          if not path.exists():
              raise SystemExit("AndroidManifest.xml not found")

          text = path.read_text(encoding="utf-8")

          app_match = re.search(r'<application\b[^>]*>', text)

          if not app_match:
              raise SystemExit("Application tag not found")

          app_tag = app_match.group(0)

          if 'android:icon=' not in app_tag:
              new_tag = app_tag[:-1] + ' android:icon="@drawable/konglong_logo">'
              text = text[:app_match.start()] + new_tag + text[app_match.end():]

          app_match = re.search(r'<application\b[^>]*>', text)
          app_tag = app_match.group(0)

          if 'android:roundIcon=' not in app_tag:
              new_tag = app_tag[:-1] + ' android:roundIcon="@drawable/konglong_logo">'
              text = text[:app_match.start()] + new_tag + text[app_match.end():]

          if 'android.software.leanback' not in text:
              text = re.sub(
                  r'(<application\b)',
                  '<uses-feature android:name="android.software.leanback" android:required="false" />\n    \\1',
                  text,
                  count=1
              )

          if 'android.hardware.touchscreen' not in text:
              text = re.sub(
                  r'(<application\b)',
                  '<uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    \\1',
                  text,
                  count=1
              )

          if 'android.intent.category.LEANBACK_LAUNCHER' not in text:
              launcher_pattern = (
                  r'<intent-filter\b[^>]*>'
                  r'(?:(?!</intent-filter>).)*?'
                  r'<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>'
                  r'(?:(?!</intent-filter>).)*?'
                  r'</intent-filter>'
              )

              match = re.search(launcher_pattern, text, re.DOTALL)

              if match:
                  block = match.group(0)
                  block = block.replace(
                      '</intent-filter>',
                      '<category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n            </intent-filter>',
                      1
                  )
                  text = text[:match.start()] + block + text[match.end():]
                  print("Android TV launcher category added")
              else:
                  print("WARNING: No standard LAUNCHER filter found")

          path.write_text(text, encoding="utf-8")
          print("Manifest configuration completed")
          PY

      - name: Configure Java and Kotlin
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle" "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys

          candidates = [Path(sys.argv[1]), Path(sys.argv[2])]
          path = next((p for p in candidates if p.exists()), None)

          if path is None:
              raise SystemExit("App Gradle file not found")

          text = path.read_text(encoding="utf-8")

          if path.suffix == ".kts":
              if "compileOptions" not in text:
                  text = text.replace(
                      "    defaultConfig {",
                      """    compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }

                      defaultConfig {""",
                      1
                  )

              if "kotlinOptions" not in text and "compilerOptions" not in text:
                  text += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          else:
              if "compileOptions" not in text:
                  text = text.replace(
                      "    defaultConfig {",
                      """    compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }

                      defaultConfig {""",
                      1
                  )

              if "kotlinOptions" not in text:
                  text = text.replace(
                      "    defaultConfig {",
                      """    kotlinOptions {
                          jvmTarget = '17'
                      }

                      defaultConfig {""",
                      1
                  )

          path.write_text(text, encoding="utf-8")
          print("Gradle configuration completed:", path)
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          cp "$APK" app-debug.apk
          echo "APK ready"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: konglong-yingshi-apk
          path: app-debug.apk
          if-no-files-found: error
